name: OpenClaw 설정 호환성 테스트

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: openclaw-config-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-mcp-isolation:
    name: Managed MCP isolation (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Initial manual measurement on 2026-08-26 resolved these channels to
        # 2026.6.34, 2026.7.1-2, and 2026.8.1-beta.3 respectively. Keep the
        # channel names floating so loader-semantic drift is detected when
        # OpenClaw publishes a replacement.
        channel:
          - extended-stable
          - latest
          - beta
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          check-latest: true

      - name: Install OpenClaw (${{ matrix.channel }})
        run: npm install --global "openclaw@${{ matrix.channel }}"

      - name: Record resolved OpenClaw version
        run: openclaw --version

      # Go는 테스트를 건너뛰어도 패키지 결과에 `ok`를 표시한다. CLI가 없거나
      # MULTICA_RUN_REAL_AGENT_TESTS가 미설정이거나 -run이 일치하지 않는 경우를
      # 성공으로 처리하지 않도록 PASS를 확인하고 SKIP은 실패로 처리한다.
      # #6897의 Windows 단계도 같은 문제를 다룬다.
      - name: Verify managed MCP isolation through the real loader
        working-directory: server
        env:
          MULTICA_RUN_REAL_AGENT_TESTS: "1"
        run: |
          set -o pipefail
          go test -tags agentintegration ./internal/daemon/execenv/ \
            -run '^TestPrepareOpenclawConfigRealCLI$' -count=1 -v \
            2>&1 | tee integration-test.log
          if grep -q -- '--- SKIP: TestPrepareOpenclawConfigRealCLI' integration-test.log; then
            echo "::error::the real-loader test skipped; nothing was verified for ${{ matrix.channel }}"
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestPrepareOpenclawConfigRealCLI' integration-test.log; then
            echo "::error::no PASS line for the real-loader test on ${{ matrix.channel }}"
            exit 1
          fi
