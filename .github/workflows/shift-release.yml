name: Shift release

on:
  push:
    branches: [main, shift/deployment-pipeline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shift-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'XxshiftxX/multica'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: bash scripts/shift/version.test.sh
      - run: bash scripts/test-go.sh --race

  images:
    if: github.repository == 'XxshiftxX/multica'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - component: backend
            dockerfile: Dockerfile
          - component: web
            dockerfile: Dockerfile.web
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate build version
        id: version
        run: |
          source scripts/shift/version.sh
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/xxshiftxx/multica-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/XxshiftxX/multica
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=shift-${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=shift-${{ matrix.component }}-${{ matrix.arch }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: digests/*

  cli:
    if: github.repository == 'XxshiftxX/multica'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: scripts/shift/build-cli.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shift-cli
          path: dist/shift/*

  publish:
    needs: [verify, images, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
      - uses: actions/download-artifact@v4
        with:
          name: shift-cli
          path: dist/shift
      - name: Publish images and release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/shift/publish-release.sh
